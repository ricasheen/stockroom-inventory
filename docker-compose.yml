name: stockroom-inventory
services:
  database:
    image: mysql:8.4
    container_name: stockroom-inventory-database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: stockroom
      MYSQL_USER: stockroom
      MYSQL_PASSWORD: stockroom_local_only
      MYSQL_ROOT_PASSWORD: stockroom_root_local_only
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - stockroom-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -ustockroom -pstockroom_local_only"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: ./backend
    container_name: stockroom-inventory-api
    restart: unless-stopped
    environment:
      APP_NAME: Stockroom
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      APP_TIMEZONE: Asia/Manila
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      LOG_CHANNEL: stderr
      SESSION_DRIVER: file
      CACHE_STORE: file
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: stockroom
      DB_USERNAME: stockroom
      DB_PASSWORD: stockroom_local_only
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy
  adminer:
    image: adminer:6.1.2
    container_name: stockroom-inventory-adminer
    environment:
      ADMINER_DEFAULT_SERVER: database
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      database:
        condition: service_healthy
volumes:
  stockroom-data:
